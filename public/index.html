<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sheet Music Player</title>
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232563eb' d='M6 2h7v2L8 5v7a3 3 0 1 1-2-2.83V2z'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- OpenSheetMusicDisplay ships a UMD bundle, so it loads as a plain script
         and the modules below use the global it defines. -->
    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@2.2.1/build/opensheetmusicdisplay.min.js"></script>
</head>
<body>
    <header>
        <h1>Sheet Music Player</h1>
        <p class="tagline">
            Upload MusicXML, MIDI, a photo or a PDF. Pick an instrument. Press play.
        </p>
    </header>

    <main>
        <section id="setup">
            <div class="field">
                <label for="file">Sheet music</label>
                <input
                    type="file"
                    id="file"
                    accept=".musicxml,.xml,.mxl,.mid,.midi,image/*,application/pdf"
                />
                <p class="hint">
                    MusicXML and MIDI load straight away. Photos and PDFs go to Claude to be read.
                </p>
            </div>

            <div class="field">
                <label for="instrument">Instrument</label>
                <select id="instrument"></select>
                <p class="hint">Sets the playback sound, and tells Claude what it is reading.</p>
            </div>

            <div class="field">
                <label>Or try a sample</label>
                <div class="samples">
                    <button data-sample="twinkle.musicxml">Twinkle (piano)</button>
                    <button data-sample="timing-test.musicxml">Timing test</button>
                    <button data-sample="drum-groove.musicxml">Drum groove</button>
                    <button data-sample="groove.mid">MIDI groove</button>
                </div>
                <p class="hint">Small files in <code>samples/</code>.</p>
            </div>
        </section>

        <p id="status" class="status" role="status" aria-live="polite" hidden></p>

        <section id="questions" class="questions" hidden></section>

        <section id="controls" hidden>
            <div class="transport">
                <button id="play" class="primary" aria-keyshortcuts="Space">Play</button>
                <button id="stop">Stop</button>
                <output id="position" class="position" aria-live="off">bar 1</output>
            </div>

            <div class="tempo">
                <label for="tempo">Tempo</label>
                <input type="range" id="tempo" min="30" max="240" step="1" value="100" />
                <output id="tempo-value">100 BPM</output>
                <button id="tempo-reset" class="link" hidden>Reset to score tempo</button>
            </div>

            <div class="toggles">
                <label><input type="checkbox" id="count-in" /> Count in</label>
                <label><input type="checkbox" id="metronome" /> Metronome</label>
            </div>

            <div class="zoom">
                <label for="zoom">Size</label>
                <input type="range" id="zoom" min="50" max="200" step="10" value="100" />
                <output id="zoom-value">100%</output>
            </div>
        </section>

        <p id="piece" class="piece" hidden></p>
        <!-- Hidden with the attribute, not with CSS: OSMD measures this
             container to lay the score out, and a display:none container
             would make it render zero pixels wide. -->
        <section id="score" class="score" hidden></section>
        <section id="roll" class="roll" hidden></section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
